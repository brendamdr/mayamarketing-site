<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAYA Marketing | Soluciones Digitales Bilingües</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Montserrat:wght@200;400;700&display=swap" rel="stylesheet">
    <style>
        /* RESET Y BASE */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
            color: #ffffff;
            line-height: 1.6;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        /* HERO SECTION - CON ESTILO PREMIUM */
        .hero {
            text-align: center;
            padding: 120px 20px;
            background: linear-gradient(135deg, #0a0a0a 0%, #111111 100%);
            position: relative;
            min-height: 90vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .hero::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 3px;
            background: #22d3ee;
        }
        
        .hero h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 5.5rem;
            font-weight: 200;
            letter-spacing: 2px;
            margin-bottom: 5px;
            color: #ffffff;
            text-transform: uppercase;
        }
        
        .hero .subtitle {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.8rem;
            font-weight: 300;
            color: #a1a1a1;
            margin-bottom: 30px;
            letter-spacing: 8px;
        }
        
        .hero .tagline {
            font-size: 1.4rem;
            color: #cccccc;
            margin-bottom: 60px;
            max-width: 700px;
            font-weight: 300;
        }
        
        /* BOTONES CON ESTILO PREMIUM */
        .btn-group {
            display: flex;
            gap: 25px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 40px;
        }
        
        .btn {
            padding: 18px 42px;
            text-decoration: none;
            border-radius: 2px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-block;
            letter-spacing: 1px;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.7s;
        }
        
        .btn:hover::before {
            left: 100%;
        }
        
        .btn-primary {
            background-color: #22d3ee;
            color: #000000;
            border: none;
            box-shadow: 0 5px 15px rgba(34, 211, 238, 0.3);
        }
        
        .btn-primary:hover {
            background-color: #0ea5e9;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(34, 211, 238, 0.4);
        }
        
        .btn-secondary {
            background-color: transparent;
            color: #ffffff;
            border: 1.5px solid #ffffff;
        }
        
        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.05);
            transform: translateY(-3px);
        }
        
        /* SERVICES SECTION - TARJETAS ELEGANTES */
        .services {
            padding: 120px 20px;
            background-color: #111111;
        }
        
        .services-header {
            text-align: center;
            margin-bottom: 80px;
        }
        
        .services-header h2 {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.8rem;
            font-weight: 300;
            color: #ffffff;
            letter-spacing: 3px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }
        
        .services-header .subtitle {
            font-size: 1.1rem;
            color: #999;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        
        .service-cards {
            display: flex;
            gap: 40px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .service-card {
            background: linear-gradient(145deg, #1a1a1a, #0f0f0f);
            border: 1px solid #222;
            border-radius: 4px;
            padding: 50px 35px;
            width: 380px;
            text-align: left;
            transition: all 0.4s ease;
            position: relative;
        }
        
        .service-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: #22d3ee;
            transform: scaleX(0);
            transition: transform 0.4s;
        }
        
        .service-card:hover::before {
            transform: scaleX(1);
        }
        
        .service-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
            border-color: #333;
        }
        
        .service-card h3 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.6rem;
            color: #22d3ee;
            margin-bottom: 20px;
            font-weight: 400;
            letter-spacing: 1.5px;
        }
        
        .price {
            font-size: 3rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 25px;
            font-family: 'Inter', sans-serif;
        }
        
        .price::before {
            content: '$';
            font-size: 2rem;
            color: #666;
            margin-right: 5px;
        }
        
        .service-card p {
            color: #aaa;
            font-size: 1.05rem;
            margin-bottom: 30px;
            line-height: 1.8;
        }
        
        .btn-service {
            background-color: transparent;
            color: #ffffff;
            border: 1.5px solid #444;
            padding: 14px 28px;
            width: 100%;
            font-size: 0.95rem;
            letter-spacing: 1.5px;
        }
        
        .btn-service:hover {
            background-color: #22d3ee;
            border-color: #22d3ee;
            color: #000000;
        }
        
        /* ABOUT SECTION */
        .about {
            padding: 120px 20px;
            text-align: center;
            background-color: #0a0a0a;
            border-top: 1px solid #222;
            border-bottom: 1px solid #222;
        }
        
        .about h2 {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.8rem;
            font-weight: 300;
            margin-bottom: 15px;
            color: #ffffff;
            letter-spacing: 2px;
        }
        
        .about .title-accent {
            font-family: 'Inter', sans-serif;
            font-size: 1.2rem;
            color: #999;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }
        
        .about p {
            font-size: 1.2rem;
            color: #bbb;
            max-width: 800px;
            margin: 0 auto 30px;
            line-height: 1.9;
        }
        
        .features {
            display: inline-block;
            text-align: left;
            margin-top: 40px;
            color: #22d3ee;
            font-size: 1.1rem;
            line-height: 2.2;
        }
        
        /* CTA SECTION */
        .cta {
            padding: 140px 20px;
            text-align: center;
            background: linear-gradient(135deg, #111111 0%, #0a0a0a 100%);
        }
        
        .cta h2 {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.8rem;
            font-weight: 300;
            margin-bottom: 20px;
            color: #ffffff;
            letter-spacing: 2px;
        }
        
        .cta p {
            font-size: 1.2rem;
            color: #aaa;
            margin-bottom: 50px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            font-weight: 300;
        }
        
        .btn-cta {
            background-color: #22d3ee;
            color: #000000;
            border: none;
            padding: 22px 55px;
            font-size: 1.2rem;
            letter-spacing: 2px;
            box-shadow: 0 8px 25px rgba(34, 211, 238, 0.3);
        }
        
        .btn-cta:hover {
            background-color: #0ea5e9;
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(34, 211, 238, 0.4);
        }
